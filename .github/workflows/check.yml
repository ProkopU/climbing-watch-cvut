name: Climbing Spot Watch

on:
  schedule:
    # re-registered after schedule failed to trigger for the first ~3h
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: climbing-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 climbing_watch.py

      - name: Commit updated state
        run: |
          git config user.name "climbing-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add climbing_watch_state.json climbing_watch.log
          git diff --cached --quiet || git commit -m "Update state"
          git push
